<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ernest Account Intelligence Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>

  :root{
    --navy:#0b2545; --navy2:#123a6b; --teal:#0fb5ae; --orange:#f2622e;
    --bg:#f4f6f9; --card:#ffffff; --border:#e3e8ef; --text:#1c2733; --sub:#5b6b7c;
    --green:#1a9e6b; --red:#d9463e; --amber:#e0a300;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:230px;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;flex-shrink:0;padding:20px 0;}
  .brand{padding:0 20px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
  .brand .name{font-size:19px;font-weight:800;letter-spacing:.3px;}
  .brand .sub{font-size:11.5px;color:#b9c8dd;margin-top:3px;}
  .navsec{padding:0 20px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8fa5c2;margin:16px 0 6px;}
  .navitem{padding:10px 20px;cursor:pointer;font-size:14.5px;color:#dce6f2;display:flex;align-items:center;gap:10px;border-left:3px solid transparent;transition:.15s;}
  .navitem:hover{background:rgba(255,255,255,.06);}
  .navitem.active{background:rgba(255,255,255,.1);border-left-color:var(--orange);color:#fff;font-weight:600;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
  .client-switch{padding:6px 14px 14px;}
  .client-btn{width:100%;text-align:left;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#fff;margin-bottom:8px;cursor:pointer;font-size:13.5px;}
  .client-btn.active{background:var(--teal);border-color:var(--teal);font-weight:700;color:#04231f;}
  .main{flex:1;padding:26px 32px 60px;max-width:1400px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;}
  .topbar h1{font-size:24px;margin:0 0 4px;}
  .breadcrumb{font-size:13px;color:var(--sub);}
  .breadcrumb .crumb{cursor:pointer;color:var(--navy2);text-decoration:underline;}
  .breadcrumb .sep{margin:0 6px;color:#b7c0cb;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(20,30,50,.04);}
  .kpi .label{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .kpi .value{font-size:24px;font-weight:800;color:var(--navy);}
  .kpi .delta{font-size:12.5px;margin-top:4px;font-weight:600;}
  .delta.up{color:var(--green);} .delta.down{color:var(--red);} .delta.flat{color:var(--sub);}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:0 1px 2px rgba(20,30,50,.04);}
  .card h3{margin:0 0 12px;font-size:15.5px;color:var(--navy);}
  .card h3 .tag{font-size:11px;font-weight:600;color:var(--sub);text-transform:none;margin-left:8px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:9px 10px;color:var(--sub);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
  td{padding:9px 10px;border-bottom:1px solid #eef1f5;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:#f7fafc;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .pill.good{background:#e4f7ee;color:var(--green);}
  .pill.warn{background:#fff3dc;color:var(--amber);}
  .pill.bad{background:#fdeceb;color:var(--red);}
  .pill.neutral{background:#eef2f7;color:var(--sub);}
  .stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:22px;}
  .stcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:.15s;}
  .stcard:hover{border-color:var(--teal);box-shadow:0 4px 14px rgba(15,181,174,.13);transform:translateY(-1px);}
  .stcard .stname{font-weight:700;font-size:14.5px;color:var(--navy);margin-bottom:2px;}
  .stcard .stloc{font-size:12px;color:var(--sub);margin-bottom:10px;}
  .stcard .strow{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;}
  .strow b{color:var(--text);}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin:26px 0 10px;font-weight:700;}
  .bcgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .bc-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .bc-card h4{margin:0 0 10px;font-size:14px;color:var(--navy);display:flex;align-items:center;gap:8px;}
  .bc-card ul{margin:0;padding-left:18px;}
  .bc-card li{font-size:13.3px;line-height:1.55;margin-bottom:9px;color:#333e49;}
  .bc-header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:22px 26px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;}
  .bc-header .h-name{font-size:22px;font-weight:800;}
  .bc-header .h-sub{font-size:13px;color:#c7d6ea;margin-top:4px;}
  .bc-metrics{display:flex;gap:26px;}
  .bc-metrics .m{text-align:right;}
  .bc-metrics .m .v{font-size:20px;font-weight:800;}
  .bc-metrics .m .l{font-size:11px;color:#b9c8dd;text-transform:uppercase;}
  .badge-icon{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
  .ic-growth{background:var(--green);} .ic-decline{background:var(--red);} .ic-cross{background:var(--teal);}
  .ic-margin{background:var(--amber);} .ic-risk{background:var(--navy2);} .ic-play{background:var(--orange);}
  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tabbtn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;cursor:pointer;color:var(--sub);font-weight:600;}
  .tabbtn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .small-muted{font-size:12px;color:var(--sub);}
  .chart-wrap{position:relative;height:260px;}
  .chart-wrap.short{height:200px;}
  .footer-note{margin-top:30px;font-size:11.5px;color:#93a1af;border-top:1px solid var(--border);padding-top:14px;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#c7d1db;border-radius:6px;}
  .search-materials{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:10px;}
</style>
<style>
  /* ---- added: loading + genie ---- */
  .loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;}
  .spinner{width:44px;height:44px;border:4px solid #d7e0ea;border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-overlay .msg{margin-top:16px;font-size:14px;color:var(--sub);}
  .load-err{max-width:520px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--red);border-radius:8px;padding:16px 18px;color:var(--text);font-size:13.5px;}
  .load-err b{color:var(--red);}
  .genie-wrap{max-width:900px;}
  .genie-hero{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:22px 26px;margin-bottom:18px;}
  .genie-hero h2{margin:0 0 4px;font-size:20px;}
  .genie-hero p{margin:0;font-size:13px;color:#c7d6ea;}
  .genie-box{display:flex;gap:10px;margin-bottom:14px;}
  .genie-input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;}
  .genie-input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,181,174,.15);}
  .genie-btn{padding:12px 20px;border:none;border-radius:10px;background:var(--teal);color:#04231f;font-weight:700;font-size:14px;cursor:pointer;}
  .genie-btn:disabled{opacity:.55;cursor:not-allowed;}
  .genie-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .genie-chip{padding:7px 12px;border:1px solid var(--border);background:#fff;border-radius:20px;font-size:12.5px;color:var(--navy2);cursor:pointer;}
  .genie-chip:hover{border-color:var(--teal);background:#f0fbfa;}
  .genie-answer{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px;}
  .genie-answer .qtext{font-weight:700;color:var(--navy);margin-bottom:10px;font-size:14.5px;}
  .genie-answer .atext{font-size:14px;line-height:1.6;color:#333e49;white-space:pre-wrap;margin-bottom:12px;}
  .genie-sql{background:#0b2545;color:#d7e6f7;border-radius:8px;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;overflow-x:auto;white-space:pre;margin-bottom:12px;}
  .genie-thinking{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13.5px;}
  .genie-thinking .spinner{width:20px;height:20px;border-width:3px;}
  /* ---- unified query panel (Option B) ---- */
  .route-badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:20px;margin-bottom:8px;text-transform:uppercase;}
  .route-badge.predict{background:#e6f7f5;color:#0a6b64;}
  .route-badge.retrieve{background:#eef2f7;color:#2c4a63;}
  .route-badge .meth{opacity:.7;font-weight:600;}
  .genie-answer .fc-mini{position:relative;height:180px;margin:10px 0 6px;}
  .genie-answer .unc-line{font-size:12px;color:var(--sub);margin:4px 0 8px;}
  .selfcheck-note{font-size:11.5px;color:#8a5a00;background:#fdf6e6;border:1px solid #f0e0b8;border-radius:6px;padding:6px 9px;margin-top:8px;}
  .fallback-note{font-size:11.5px;color:#2c4a63;background:#eef4fb;border:1px solid #d3e2f0;border-radius:6px;padding:6px 9px;margin-bottom:8px;}
  /* ---- forecast controls ---- */
  .fc-controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
  .fc-field{display:flex;flex-direction:column;gap:5px;}
  .fc-field label{font-size:11.5px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;}
  .fc-field select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:#fff;min-width:150px;}
  .fc-field select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,181,174,.15);}
  .fc-run .genie-btn{padding:9px 20px;}
  /* ---- added: docked right Genie panel ---- */
  #main{flex:1;min-width:0;}
  .genie-panel{width:360px;flex:0 0 360px;background:var(--card);border-left:1px solid var(--border);
    display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:hidden;}
  .genie-panel-head{padding:18px 20px 14px;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;}
  .genie-panel-head .gp-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .genie-panel-head .gp-badge{font-size:10px;font-weight:700;letter-spacing:.5px;background:var(--teal);color:#04231f;
    padding:2px 7px;border-radius:20px;}
  .genie-panel-head .gp-sub{font-size:12px;color:#c7d6ea;margin-top:4px;}
  .genie-panel-body{flex:1;overflow-y:auto;padding:16px;}
  .genie-panel .genie-box{margin-bottom:12px;}
  .genie-panel .genie-answer{padding:14px 15px;}
  .genie-panel .genie-sql{font-size:11.5px;}
  @media(max-width:1100px){ .genie-panel{width:300px;flex-basis:300px;} }
  /* ---- governance top-nav tabs ---- */
  .main-wrap{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topnav{display:flex;gap:4px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;overflow-x:auto;}
  .topnav .tab{padding:14px 16px 12px;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.15s;}
  .topnav .tab:hover{color:var(--navy);}
  .topnav .tab.active{color:var(--navy);border-bottom-color:var(--orange);}
  .main-wrap .main{flex:1;}
</style>
</head>

<body>
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="msg" id="loadingMsg">Connecting to Databricks &middot; workspace.sss &hellip;</div>
</div>
<div class="app" id="appRoot" style="display:none;">
  <div class="sidebar">
    <div class="brand">
      <div class="name">ERNEST</div>
      <div class="sub">Account Intelligence &middot; Strategic Selling</div>
    </div>
    <div class="client-switch" id="clientSwitch"></div>
    <div class="navsec">Analyze</div>
    <div id="navItems"></div>
  </div>
  <div class="main-wrap">
    <div class="topnav" id="topNav"></div>
    <div class="main" id="main"></div>
  </div>
  <aside class="genie-panel" id="geniePanel">
    <div class="genie-panel-head">
      <div class="gp-title">DATA ZEN <span class="gp-badge">AI/BI</span></div>
      <div class="gp-sub">Retrieval &amp; forecasts &middot; auto-routed</div>
    </div>
    <div class="genie-panel-body">
      <div class="genie-box">
        <input class="genie-input" id="genieInput" placeholder="Ask about your data&hellip;"
               onkeydown="if(event.key==='Enter')askGenie()">
        <button class="genie-btn" id="genieBtn" onclick="askGenie()">Ask</button>
      </div>
      <div class="genie-chips" id="genieChips"></div>
      <div id="genieResults"></div>
    </div>
  </aside>
</div>
<script>

let DATA = null;
let CLIENTS = [];

let state = { client: CLIENTS[0], view: 'portfolio', shipTo: null };
let charts = {};

function fmtMoney(x, digits){ digits = digits===undefined?0:digits; return '$' + Number(x).toLocaleString(undefined,{minimumFractionDigits:digits,maximumFractionDigits:digits}); }
function fmtPct(x){ return Number(x).toFixed(1) + '%'; }
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }
function monthLabel(my){ const [m,y]=my.split('-'); return m+"/"+y.slice(2); }

function setState(patch){ state = Object.assign({}, state, patch); render(); }

function renderSidebar(){
  const cs = document.getElementById('clientSwitch');
  cs.innerHTML = CLIENTS.map(c => {
    const active = c===state.client ? 'active' : '';
    return `<button class="client-btn ${active}" onclick="setState({client:'${c}', shipTo:null})">${c}</button>`;
  }).join('');

  const items = [
    ['portfolio','Portfolio Analysis'],
    ['overview','Overview'],
    ['shiptos','Ship-To Drilldown'],
    ['trends','Growth & Cross-Sell'],
    ['risk','Risk Radar'],
    ['battlecard','Battle Card'],
    ['forecast','Forecast (TabPFN)'],
  ];
  const nav = document.getElementById('navItems');
  nav.innerHTML = items.map(([key,label]) => {
    const active = key===state.view ? 'active':'';
    return `<div class="navitem ${active}" onclick="setState({view:'${key}', shipTo:null})"><span class="dot"></span>${label}</div>`;
  }).join('');
}

function renderTopNav(){
  const tabs = [
    ['guardrails','\uD83D\uDEE1 Guardrails'],
    ['audit','\uD83D\uDCCB Audit Trail'],
    ['lineage','\uD83D\uDD17 Lineage'],
  ];
  const nav = document.getElementById('topNav');
  if(!nav) return;
  nav.innerHTML = tabs.map(([key,label]) => {
    const active = key===state.view ? 'active':'';
    return `<div class="tab ${active}" onclick="setState({view:'${key}', shipTo:null})">${label}</div>`;
  }).join('');
}

function breadcrumb(){
  let parts = [`<span class="crumb" onclick="setState({shipTo:null})">${state.client}</span>`];
  if(state.shipTo){ parts.push(`<span class="sep">/</span><span>${state.shipTo}</span>`); }
  return `<div class="breadcrumb">${parts.join('')}</div>`;
}

function pillForGtm(pct){
  if(pct >= 28) return `<span class="pill good">${fmtPct(pct)}</span>`;
  if(pct >= 15) return `<span class="pill warn">${fmtPct(pct)}</span>`;
  return `<span class="pill bad">${fmtPct(pct)}</span>`;
}

function pillForGrowth(pct){
  if(pct===999) return `<span class="pill good">New</span>`;
  if(pct > 5) return `<span class="pill good">+${pct.toFixed(0)}%</span>`;
  if(pct < -5) return `<span class="pill bad">${pct.toFixed(0)}%</span>`;
  return `<span class="pill neutral">${pct.toFixed(0)}%</span>`;
}

// ---------------- OVERVIEW ----------------
// ---------------- FORECAST (TabPFN prediction page) ----------------
let FC_STATE = { target:'revenue', scope:'portfolio', entity:'', horizon:3, result:null, loading:false, error:null };

function fcEntityOptions(){
  // populate entity dropdown based on scope
  if(FC_STATE.scope==='portfolio') return '';
  if(FC_STATE.scope==='client'){
    return CLIENTS.map(c=>`<option value="${c.replace(/"/g,'&quot;')}" ${c===FC_STATE.entity?'selected':''}>${c}</option>`).join('');
  }
  // shipto: list all ship-tos across clients (value carries client via data attr handled in change)
  let opts=[];
  CLIENTS.forEach(c=>{
    (DATA.clients[c].ship_tos||[]).forEach(s=>{
      opts.push(`<option value="${s.replace(/"/g,'&quot;')}" data-client="${c.replace(/"/g,'&quot;')}" ${s===FC_STATE.entity?'selected':''}>${s} &middot; ${c}</option>`);
    });
  });
  return opts.join('');
}

function renderForecast(){
  const targets = [['revenue','Revenue'],['gtm','GTM $'],['gtm_pct','GTM %'],['orders','Orders']];
  const scopes = [['portfolio','Whole portfolio'],['client','A client'],['shipto','A ship-to']];
  const horizons = [1,2,3,6,9,12];

  document.getElementById('main').innerHTML = `
    <div class="topbar"><div><h1>Forecast <span class="tag">TabPFN prediction</span></h1><div class="breadcrumb">Project a metric forward with an uncertainty band</div></div></div>
    <div class="card">
      <div class="fc-controls">
        <div class="fc-field"><label>Metric</label>
          <select id="fcTarget" onchange="fcOnChange()">${targets.map(([k,l])=>`<option value="${k}" ${k===FC_STATE.target?'selected':''}>${l}</option>`).join('')}</select>
        </div>
        <div class="fc-field"><label>Scope</label>
          <select id="fcScope" onchange="fcScopeChange()">${scopes.map(([k,l])=>`<option value="${k}" ${k===FC_STATE.scope?'selected':''}>${l}</option>`).join('')}</select>
        </div>
        <div class="fc-field" id="fcEntityWrap" style="${FC_STATE.scope==='portfolio'?'display:none;':''}"><label>${FC_STATE.scope==='shipto'?'Ship-to':'Client'}</label>
          <select id="fcEntity" onchange="fcEntityChange()">${fcEntityOptions()}</select>
        </div>
        <div class="fc-field"><label>Horizon</label>
          <select id="fcHorizon" onchange="fcOnChange()">${horizons.map(h=>`<option value="${h}" ${h===FC_STATE.horizon?'selected':''}>${h} month${h>1?'s':''}</option>`).join('')}</select>
        </div>
        <div class="fc-field fc-run"><label>&nbsp;</label>
          <button class="genie-btn" id="fcRun" onclick="runForecast()" ${FC_STATE.loading?'disabled':''}>${FC_STATE.loading?'Forecasting&hellip;':'Run forecast'}</button>
        </div>
      </div>
    </div>
    <div id="fcResult">${renderForecastResult()}</div>
    <div class="footer-note">Predictions come from a self-hosted model on your own data &mdash; no data leaves your environment. TabPFN spec, Phase&nbsp;1. AI-generated; validate before customer-facing use.</div>
  `;
  // draw chart if we already have a result in state
  if(FC_STATE.result && !FC_STATE.error) drawForecastChart(FC_STATE.result);
}

function renderForecastResult(){
  if(FC_STATE.loading){
    return `<div class="card"><div class="genie-thinking"><div class="spinner"></div> Building features and running the model&hellip;</div></div>`;
  }
  if(FC_STATE.error){
    return `<div class="card"><div class="load-err"><b>Could not forecast:</b> ${escapeHtml(FC_STATE.error)}</div></div>`;
  }
  if(!FC_STATE.result) return '';
  const r = FC_STATE.result;
  const engineTag = r.engine==='tabpfn' ? '<span class="pill good">TabPFN</span>'
                   : r.engine==='statistical-fallback' ? '<span class="pill warn">trend model</span>'
                   : `<span class="pill warn">${escapeHtml(r.engine)}</span>`;
  const fmt = (v)=> r.money ? fmtMoney(v) : (r.target==='gtm_pct'? Number(v).toFixed(1)+'%' : Number(v).toLocaleString());
  const lastF = r.forecast[r.forecast.length-1];
  return `
    <div class="kpis">
      <div class="kpi"><div class="label">Projected ${escapeHtml(r.target_label)} &middot; ${escapeHtml(r.forecast[r.forecast.length-1].month)}</div><div class="value">${fmt(lastF.point)}</div><div class="small-muted">central estimate</div></div>

function fcScopeChange(){
  FC_STATE.scope = document.getElementById('fcScope').value;
  FC_STATE.entity = '';       // reset entity when scope changes
  renderForecast();
}
function fcEntityChange(){
  const sel = document.getElementById('fcEntity');
  FC_STATE.entity = sel.value;
  const opt = sel.options[sel.selectedIndex];
  FC_STATE.entityClient = opt ? opt.getAttribute('data-client') : null;
}
function fcOnChange(){
  FC_STATE.target = document.getElementById('fcTarget').value;
  FC_STATE.horizon = parseInt(document.getElementById('fcHorizon').value,10);
}

async function runForecast(){
  fcOnChange();
  if(document.getElementById('fcEntity')) fcEntityChange();
  if(FC_STATE.scope!=='portfolio' && !FC_STATE.entity){
    FC_STATE.error = 'Please choose a '+(FC_STATE.scope==='shipto'?'ship-to':'client')+' first.';
    FC_STATE.result=null; document.getElementById('fcResult').innerHTML=renderForecastResult(); return;
  }
  FC_STATE.loading=true; FC_STATE.error=null;
  document.getElementById('fcResult').innerHTML = renderForecastResult();
  const btn=document.getElementById('fcRun'); if(btn){btn.disabled=true;btn.textContent='Forecasting…';}
  try{
    const body = { target:FC_STATE.target, scope:FC_STATE.scope, entity:FC_STATE.entity||null,
                   client: FC_STATE.scope==='shipto'? (FC_STATE.entityClient||null) : null,
                   horizon:FC_STATE.horizon };
    const res = await fetch('/api/predict', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    FC_STATE.result = data; FC_STATE.loading=false; FC_STATE.error=null;
  }catch(e){
    FC_STATE.loading=false; FC_STATE.error=e.message; FC_STATE.result=null;
  }
  document.getElementById('fcResult').innerHTML = renderForecastResult();
  if(FC_STATE.result && !FC_STATE.error) drawForecastChart(FC_STATE.result);
}

function drawForecastChart(r){
  const el = document.getElementById('fcChart');
  if(!el) return;
  destroyChart('fcChart');
  // history + forecast on one continuous axis; band as two filled lines
  const histLabels = r.history.map(h=>h.month);
  const fcLabels = r.forecast.map(f=>f.month);
  const labels = histLabels.concat(fcLabels);
  const nH = histLabels.length, nF = fcLabels.length;
  const pad = (arr)=> arr;
  const histLine = r.history.map(h=>h.value).concat(new Array(nF).fill(null));
  // connect the seam: forecast central starts from last history point
  const seam = r.history.length? r.history[r.history.length-1].value : null;
  const centralLine = new Array(nH-1).fill(null).concat([seam]).concat(r.forecast.map(f=>f.point));
  const lowerLine = new Array(nH).fill(null).concat(r.forecast.map(f=>f.lower));
  const upperLine = new Array(nH).fill(null).concat(r.forecast.map(f=>f.upper));

  charts.fcChart = new Chart(el, {
    type:'line',
    data:{ labels, datasets:[
      { label:'Upper (90%)', data:upperLine, borderColor:'rgba(15,181,174,0.0)', backgroundColor:'rgba(15,181,174,0.15)', pointRadius:0, fill:'+1', tension:.3 },
      { label:'Lower (10%)', data:lowerLine, borderColor:'rgba(15,181,174,0.0)', backgroundColor:'rgba(15,181,174,0.15)', pointRadius:0, fill:false, tension:.3 },
      { label:'Forecast', data:centralLine, borderColor:'#0fb5ae', borderWidth:2, borderDash:[6,4], pointRadius:2, tension:.3 },
      { label:'History', data:histLine, borderColor:'#0b2545', borderWidth:2, pointRadius:2, tension:.3 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'bottom', labels:{boxWidth:12,font:{size:11}, filter:(it)=> it.text==='History'||it.text==='Forecast'}} },
      scales:{ y:{beginAtZero:false, title:{display:true, text:r.target_label}}, x:{ticks:{font:{size:10}}} }
    }
  });
}

async function apiGet(p){ const r = await fetch(p); return r.json(); }
async function apiPost(p, b){
  const r = await fetch(p, {method:'POST', headers:{'Content-Type':'application/json'},
                           body: JSON.stringify(b||{})});
  return r.json();
}
function guardChip(action){
  const map = {PASS:'good', MASK:'warn', BLOCK:'bad'};
  return `<span class="pill ${map[action]||'neutral'}">${action}</span>`;
}

async function checkGuardrails(){
  const text = (document.getElementById('grInput').value||'').trim();
  if(!text) return;
  const v = await apiPost('/api/guardrails/check', {text});
  let html = guardChip(v.action);
  if(v.blocked)    html += ' <span class="pill bad">Prompt-injection</span>';
  if(v.pii)        html += ' <span class="pill warn">PII masked</span>';
  if(v.high_value) html += ' <span class="pill warn">High-value &rarr; HITL</span>';
  if(v.action==='PASS' && !v.high_value) html += ' <span class="pill good">Clean</span>';
  html += `<p style="margin:10px 0 0">${v.reason}</p>`;
  if(v.pii) html += `<div style="margin-top:8px"><div style="font-size:12px;color:var(--sub)">Masked text sent to model:</div>
     <pre style="background:var(--bg);padding:10px;border-radius:6px;border:1px solid var(--border);white-space:pre-wrap;font-size:13px">${escapeHtml(v.masked_text)}</pre></div>`;
  document.getElementById('grResult').innerHTML = html;
  // record the check in the audit trail
  await apiPost('/api/audit', {
    decision: (v.blocked?'Blocked · ':v.pii?'PII masked · ':v.high_value?'High-value · ':'Checked · ')
              + (text.length>40?text.slice(0,40)+'…':text),
    model:'guardrail-engine', conf: v.high_value?61:95, decided_by:'Guardrails tab'
  });
}

// ---------------- GENIE (AI/BI natural language) ----------------
let GENIE_HISTORY = [];

function initGeniePanel(){
  const suggestions = [
    "Forecast revenue next quarter",
    "What will GTM be for iFixit next 6 months?",
    "Top 10 ship-to locations by revenue",
    "Which product hierarchies have the lowest GTM %?",
    "Show materials with PO variance over 20%",
    "Total revenue by state for this quarter",
    "Which vendors supply the most SKUs?"
  ];
  const chips = document.getElementById('genieChips');
  if(chips){
    chips.innerHTML = suggestions.map(s=>
      `<span class="genie-chip" onclick="document.getElementById('genieInput').value='${s.replace(/'/g,"\\'")}';askGenie()">${s}</span>`
    ).join('');
  }
  paintGenie();
}

function renderGenieCard(item){
  if(item.pending){
    return `<div class="genie-answer"><div class="qtext">${escapeHtml(item.question)}</div>
      <div class="genie-thinking"><div class="spinner"></div> ${escapeHtml(item.thinking||'Working on it…')}</div></div>`;
  }
  if(item.error){
    return `<div class="genie-answer"><div class="qtext">${escapeHtml(item.question)}</div>
      <div class="load-err"><b>Error:</b> ${escapeHtml(item.error)}</div></div>`;
  }
  const env = item.result || {};
  const kind = env.kind || 'retrieval';
  const routing = env.routing || {};
  const badge = kind==='prediction'
    ? `<span class="route-badge predict">Forecast <span class="meth">· ${escapeHtml(routing.method||'')}</span></span>`
    : `<span class="route-badge retrieve">Retrieval <span class="meth">· ${escapeHtml(routing.method||'')}</span></span>`;
  const fallback = routing.fallback
    ? `<div class="fallback-note">Tried a forecast but ${escapeHtml(routing.fallback)} — answered from data instead.</div>` : '';

  // prediction body: answer + inline confidence-band chart
  if(kind==='prediction' && env.chart){
    const chartId = 'gcChart_'+item.id;
    const u = env.uncertainty||{};
    return `<div class="genie-answer">
      <div class="qtext">${escapeHtml(item.question)}</div>
      ${badge}${fallback}
      <div class="atext" style="font-size:13.5px;line-height:1.55;color:#333e49;">${escapeHtml(env.answer||'')}</div>
      <div class="fc-mini"><canvas id="${chartId}"></canvas></div>
      ${selfCheckHtml(env.self_check)}
    </div>`;
  }

  // retrieval body: answer + optional table
  let rowsHtml='';
  const table = env.table;
  if(table && table.rows && table.rows.length){
    const cols = table.columns && table.columns.length ? table.columns : Object.keys(table.rows[0]);
    rowsHtml = `<table><thead><tr>${cols.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
      <tbody>${table.rows.slice(0,25).map(r=>`<tr>${cols.map(c=>`<td>${escapeHtml(String(r[c]??''))}</td>`).join('')}</tr>`).join('')}</tbody></table>
      ${table.rows.length>25?`<div class="small-muted" style="margin-top:8px;">Showing 25 of ${table.rows.length} rows.</div>`:''}`;
  }
  return `<div class="genie-answer">
    <div class="qtext">${escapeHtml(item.question)}</div>
    ${badge}${fallback}
    ${env.answer?`<div class="atext" style="font-size:13.5px;line-height:1.55;color:#333e49;margin-bottom:8px;">${escapeHtml(env.answer)}</div>`:''}
    ${env.sql?`<div class="genie-sql">${escapeHtml(env.sql)}</div>`:''}
    ${rowsHtml}
    ${selfCheckHtml(env.self_check)}
  </div>`;
}

function selfCheckHtml(sc){
  if(!sc || sc.status==='ok') return '';
  return `<div class="selfcheck-note">${escapeHtml(sc.note||'This answer may be incomplete.')}</div>`;
}

// Draw the inline prediction chart for a card (reuses the forecast chart shape).
function drawCardChart(item){
  const env = item.result||{};
  if(env.kind!=='prediction' || !env.chart) return;
  const el = document.getElementById('gcChart_'+item.id);
  if(!el || typeof Chart==='undefined') return;
  const c = env.chart;
  const histLabels = c.history.map(h=>h.month);
  const fcLabels = c.forecast.map(f=>f.month);
  const labels = histLabels.concat(fcLabels);
  const nH=histLabels.length, nF=fcLabels.length;
  const seam = nH? c.history[nH-1].value : null;
  const histLine = c.history.map(h=>h.value).concat(new Array(nF).fill(null));
  const centralLine = new Array(nH-1).fill(null).concat([seam]).concat(c.forecast.map(f=>f.point));
  const lowerLine = new Array(nH).fill(null).concat(c.forecast.map(f=>f.lower));
  const upperLine = new Array(nH).fill(null).concat(c.forecast.map(f=>f.upper));
  if(charts['gcChart_'+item.id]){ try{charts['gcChart_'+item.id].destroy();}catch(e){} }
  charts['gcChart_'+item.id] = new Chart(el,{ type:'line',
    data:{ labels, datasets:[
      {label:'Upper', data:upperLine, borderColor:'rgba(15,181,174,0)', backgroundColor:'rgba(15,181,174,0.15)', pointRadius:0, fill:'+1', tension:.3},
      {label:'Lower', data:lowerLine, borderColor:'rgba(15,181,174,0)', backgroundColor:'rgba(15,181,174,0.15)', pointRadius:0, fill:false, tension:.3},
      {label:'Forecast', data:centralLine, borderColor:'#0fb5ae', borderWidth:2, borderDash:[5,4], pointRadius:1.5, tension:.3},
      {label:'History', data:histLine, borderColor:'#0b2545', borderWidth:2, pointRadius:1.5, tension:.3},
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false}},
      scales:{ y:{beginAtZero:false, ticks:{font:{size:9}}}, x:{ticks:{font:{size:8},maxRotation:0,autoSkip:true,maxTicksLimit:6}} } }
  });
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let GC_SEQ = 0;
async function askGenie(){
  const input = document.getElementById('genieInput');
  const q = (input.value||'').trim();
  if(!q) return;
  input.value = '';
  const item = { id: ++GC_SEQ, question:q, pending:true, thinking:'Deciding how to answer…' };
  GENIE_HISTORY.unshift(item);
  paintGenie();
  try{
    const res = await fetch('/api/query', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question:q})
    });
    const data = await res.json();
    item.pending = false;
    if(data.error){ item.error = data.error; }
    else { item.result = data; }
  }catch(e){
    item.pending = false; item.error = e.message;
  }
  paintGenie();
}

// Repaint the results feed, then (re)draw any prediction charts that are now in the DOM.
function paintGenie(){
  const el = document.getElementById('genieResults');
  if(!el) return;
  el.innerHTML = GENIE_HISTORY.map(renderGenieCard).join('');
  GENIE_HISTORY.forEach(it=>{ if(it.result && it.result.kind==='prediction') drawCardChart(it); });
}

  try{
    const res = await fetch('/api/data');
    if(!res.ok){ const j = await res.json().catch(()=>({})); throw new Error(j.error || ('HTTP '+res.status)); }
    DATA = await res.json();

      '<br><br>Check the SQL warehouse ID, token, and that workspace.sss.sales / inventory exist and are readable.</div>';
  }
}
boot();
